name: Validate bootstrap remainder fix

on:
  push:
    branches:
      - ci/bootstrap-remainder

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      TQDM_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run bootstrap tests
        run: pytest -q tests/test_misc.py -k "bootstrap"
